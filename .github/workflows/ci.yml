name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            cc: gcc
            cxx: g++
          - os: ubuntu-latest
            compiler: clang
            cc: clang
            cxx: clang++
          - os: macos-latest
            compiler: clang
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DSCOUR_WARNINGS_AS_ERRORS=ON
          -DSCOUR_BUILD_BENCH=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Smoke test
        run: |
          ./build/scour --version
          ./build/scour inspect fixtures/contract-leak.pdf || test $? -eq 1
          ./build/scour scrub fixtures/contract-leak.pdf -o /tmp/clean.pdf --pii
          ./build/scour verify /tmp/clean.pdf --pii
      - name: Benchmark (smoke)
        run: ./build/scour_bench --pages 20 --lines 10 --iterations 1

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=Debug
          -DSCOUR_SANITIZE=ON
          -DSCOUR_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Unit tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ./build-asan/tests/scour_tests
      - name: End-to-end tests
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          bash tests/cli_e2e.sh
          ./build-asan/scour
          ./build-asan/scour_fixtures
          build-asan/e2e

  fuzz:
    name: Mutation fuzzing (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DSCOUR_SANITIZE=ON
          -DSCOUR_BUILD_FUZZ=ON
          -DSCOUR_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build-fuzz --parallel
      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          ./build-fuzz/scour_fuzz
          --corpus fixtures
          --iterations 20000
          --seed ${{ github.run_number }}

  interoperability:
    name: pikepdf + pypdf interoperability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure and build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSCOUR_BUILD_TESTS=OFF
          cmake --build build --parallel
      - name: Install verification dependencies
        run: python -m pip install -r tools/requirements-external.txt
      - name: Verify against independent readers
        run: python tools/verify_external.py --scour build/scour

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build-msvc -A x64 2>&1 | tee configure.log || {
            tail -n 40 configure.log
            exit 1
          }
      - name: Assert boundary line
        shell: bash
        run: |
          grep -F "scour: the CLI and dashboard need a POSIX terminal; building the engine and tests only" configure.log || {
            cat configure.log
            exit 1
          }
      - name: Build
        shell: bash
        run: |
          build_status=0
          cmake --build build-msvc --config Release 2>&1 | tee build.log || build_status=$?
          if grep -E "error C[0-9]+|C4566|C1083" build.log; then
            exit 1
          fi
          if [ "$build_status" -ne 0 ]; then
            exit "$build_status"
          fi
      - name: Assert CLI absent
        shell: bash
        run: |
          test -f build-msvc/tests/Release/scour_tests.exe
          test -z "$(find build-msvc -name scour.exe)"
      - name: Unit tests
        shell: bash
        run: |
          ./build-msvc/tests/Release/scour_tests.exe 2>&1 | tee test.log
          grep -E "[0-9]+/[0-9]+ tests passed" test.log
      - name: Bytes tests (UTF-8 regression check)
        shell: bash
        run: ./build-msvc/tests/Release/scour_tests.exe --filter=bytes
      - name: CTest
        shell: bash
        run: ctest --test-dir build-msvc -C Release --output-on-failure

  packages:
    name: Source and binary packages
    runs-on: ubuntu-latest
    needs: [build, sanitizers, fuzz]
    steps:
      - uses: actions/checkout@v4
      - name: Build the release zip
        run: bash tools/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: scour-source
          path: dist/*.zip
          if-no-files-found: error
      # Same script the tag-triggered release runs, so the packaging and the
      # archive checks cannot rot between releases.
      - name: Build, test and package the Linux binary
        run: bash tools/release.sh linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: scour-linux-x86_64
          path: dist/scour-*.tar.gz*
          if-no-files-found: error
