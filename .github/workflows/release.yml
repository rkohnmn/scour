name: release

# Tagging v1.0.0 publishes a GitHub release with prebuilt binaries for Linux
# (x86-64, arm64) and macOS (arm64, x86-64), plus one SHA256SUMS.txt. A manual
# run builds and attaches the same artefacts to the workflow run without
# creating a release, which is how the pipeline gets exercised before a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: linux-x86_64
          - os: ubuntu-24.04-arm
            triple: linux-aarch64
          - os: macos-15
            triple: macos-arm64
          - os: macos-15-intel
            triple: macos-x86_64
    steps:
      - uses: actions/checkout@v4
      # The script configures, builds, runs ctest, packages, and finally drives
      # the extracted archive. A failure here means the artefact is not shippable.
      - name: Build, test and package
        run: bash tools/release.sh ${{ matrix.triple }}
      - uses: actions/upload-artifact@v4
        with:
          name: scour-${{ matrix.triple }}
          path: dist/scour-*.tar.gz*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: [binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Assemble checksums
        run: |
          cd dist
          rm -f ./*.sha256
          ls -l
          sha256sum scour-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-running a release after a failed job must replace the assets
            # rather than fail on their existence.
            gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" \
              --title "Scour ${TAG#v}" \
              --generate-notes \
              dist/*.tar.gz dist/SHA256SUMS.txt
          fi
          gh release view "$TAG" --json url --jq .url
